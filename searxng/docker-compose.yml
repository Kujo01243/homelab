services:
    searxng:
        restart: unless-stopped
        container_name: searxng
        image: searxng/searxng
        environment:
         - BASE_URL=${BASE_URL}
        volumes:
          - /root/searxng/etc/searxng:/etc/searxng
          - /root/searxng/var/data/searxng:/var/cache/searxng
        networks:
          dmz:
            ipv4_address: ${ip_address}

networks:
  dmz:
    external: true